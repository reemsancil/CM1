<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Teacher Results | CM1 Learning Games</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="results.css">
</head>
<body>
<main class="game-page">
  <a class="home-link" href="index.html">← CM1 Homepage</a>
  <section class="game-panel" aria-labelledby="teacher-title">
    <header class="game-header"><h1 id="teacher-title">Teacher Results</h1></header>
    <div class="teacher-content">
      <form class="teacher-form" id="teacher-login">
        <h2>Teacher sign-in</h2>
        <label for="teacher-email">Email</label>
        <input id="teacher-email" type="email" autocomplete="username" required>
        <label for="teacher-password">Password</label>
        <input id="teacher-password" type="password" autocomplete="current-password" required>
        <button class="primary-button" type="submit">Sign in</button>
      </form>
      <p id="teacher-status" class="teacher-status" role="status" aria-live="polite"></p>
      <div id="teacher-results" hidden>
        <div class="teacher-toolbar">
          <button class="secondary-button" id="refresh-results" type="button">Refresh results</button>
          <button class="primary-button" id="download-csv" type="button" disabled>Download CSV</button>
          <button class="secondary-button" id="preview-directions" type="button">Preview directions games 🔒</button>
          <button class="secondary-button" id="sign-out" type="button">Sign out</button>
        </div>
        <p id="preview-status" role="status" aria-live="polite"></p>
        <section id="directions-preview" hidden><h2>Directions — teacher preview</h2><p>Students still see the locked lesson. Preview scores are not saved or submitted.</p><button id="close-directions-preview" class="secondary-button" type="button">Close preview</button><iframe id="directions-preview-frame" title="Directions games teacher preview" sandbox="allow-scripts" style="display:block;width:100%;height:850px;border:1px solid #c7d6c5;margin-top:1rem"></iframe></section>
        <p id="gift-teacher-status" role="status" aria-live="polite"></p><div id="section-results"></div>
      </div>
    </div>
  </section>
</main>
<script src="results-api.js"></script>
<script src="data.js"></script>
<script src="gift-config.js"></script><script src="unit-progress.js"></script><script src="teacher-gifts.js"></script><script src="teacher-preview.js"></script><script src="teacher.js"></script>
</body>
</html>
